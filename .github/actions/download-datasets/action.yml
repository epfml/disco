name: Download datasets
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v5
      with:
        path: datasets
        key: datasets-${{ hashFiles('datasets/populate') }} # Only invalidate cache when download script changes
        lookup-only: true
    - if: steps.cache.outputs.cache-hit != 'true'
      run: datasets/populate
      shell: bash
