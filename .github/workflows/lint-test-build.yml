name: lint-test-build
on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  download-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-datasets
      - run: datasets/populate

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run format:check

  lint-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run lint

  build-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=discojs run build

  build-lib-node:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=discojs-node run build

  build-lib-web:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=discojs-web build

  build-server:
    needs: build-lib-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=server build

  build-server-docker:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: docker build .
      - run: |
          docker build --quiet --load . | \
            xargs docker run --detach --publish 8080:8080
          timeout=120
          while ! curl http://localhost:8080
          do
            [ $timeout -eq 0 ] && exit 1
            sleep 1
            timeout=$((timeout - 1))
          done

  build-cli:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=cli build

  build-webapp:
    needs: build-lib-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=webapp run build

  build-docs-examples:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=server run build
      - run: npm run build
        working-directory: docs/examples

  test-most:
    needs: [build-server, download-datasets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/cache-datasets
      - run: npm --workspace={discojs,discojs-{node,web},server} run build
      - run: npx vitest --run

  test-webapp:
    needs: [build-webapp, download-datasets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/cache-datasets
      - run: npm --workspace=webapp run build
      - run: npm --workspace=webapp run test:unit
      - uses: cypress-io/github-action@v7
        with:
          working-directory: webapp
          install: false
          start: npx vite --mode test --port 1351

  test-cli:
    needs: [build-server, download-datasets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/cache-datasets
      - run: npm --workspace=server run build
      - run: npm --workspace=cli start -- -t cifar10 -u 3 -e 1 -r 1

  test-docs-examples:
    needs: [build-server, download-datasets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/cache-datasets
      - run: npm --workspace=server run build
      - run: npm run test
        working-directory: docs/examples
