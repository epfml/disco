name: verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      # Code changes need a workspace build; analysis-only changes do not.
      # Pushes to main always run the complete pipeline.
      static_analysis: ${{ github.event_name == 'push' || steps.select.outputs.changes != '[]' }}
      build: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.discojs_web == 'true' ||
          steps.select.outputs.server == 'true' ||
          steps.select.outputs.webapp == 'true' ||
          steps.select.outputs.cli == 'true' ||
          steps.select.outputs.docs_examples == 'true' ||
          steps.select.outputs.onnx_converter == 'true'
        }}
      docker: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.server == 'true'
        }}
      # The converter has no test job; only these areas require tests.
      any_tests: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.discojs_web == 'true' ||
          steps.select.outputs.server == 'true' ||
          steps.select.outputs.webapp == 'true' ||
          steps.select.outputs.cli == 'true' ||
          steps.select.outputs.docs_examples == 'true'
        }}
      discojs: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true'
        }}
      discojs_node: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true'
        }}
      discojs_web: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_web == 'true'
        }}
      server: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.server == 'true'
        }}
      webapp: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.discojs_web == 'true' ||
          steps.select.outputs.server == 'true' ||
          steps.select.outputs.webapp == 'true'
        }}
      cli: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.server == 'true' ||
          steps.select.outputs.cli == 'true'
        }}
      docs_examples: >-
        ${{
          github.event_name == 'push' ||
          steps.select.outputs.everything == 'true' ||
          steps.select.outputs.discojs == 'true' ||
          steps.select.outputs.discojs_node == 'true' ||
          steps.select.outputs.server == 'true' ||
          steps.select.outputs.docs_examples == 'true'
        }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checkouts use a synthetic merge commit; depth 2 includes its base parent.
          fetch-depth: 2
      - id: select
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ""
          filters: .github/ci-paths.yml
          predicate-quantifier: some

  download-datasets:
    needs: affected
    if: needs.affected.outputs.any_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/download-datasets

  static-analysis:
    needs: affected
    if: needs.affected.outputs.static_analysis == 'true'
    uses: ./.github/workflows/_static-analysis.yml

  build:
    needs: [affected, static-analysis]
    if: needs.affected.outputs.build == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      docker: ${{ needs.affected.outputs.docker == 'true' }}

  test:
    needs: [affected, download-datasets, build]
    if: needs.affected.outputs.any_tests == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      discojs: ${{ needs.affected.outputs.discojs == 'true' }}
      discojs_node: ${{ needs.affected.outputs.discojs_node == 'true' }}
      discojs_web: ${{ needs.affected.outputs.discojs_web == 'true' }}
      server: ${{ needs.affected.outputs.server == 'true' }}
      webapp: ${{ needs.affected.outputs.webapp == 'true' }}
      cli: ${{ needs.affected.outputs.cli == 'true' }}
      docs_examples: ${{ needs.affected.outputs.docs_examples == 'true' }}

  complete:
    if: always()
    needs: [affected, download-datasets, static-analysis, build, test]
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ needs.affected.result }}
      RUN_STATIC: ${{ needs.affected.outputs.static_analysis }}
      RUN_BUILD: ${{ needs.affected.outputs.build }}
      RUN_TESTS: ${{ needs.affected.outputs.any_tests }}
      DATASETS: ${{ needs.download-datasets.result }}
      STATIC: ${{ needs.static-analysis.result }}
      BUILD: ${{ needs.build.result }}
      TEST: ${{ needs.test.result }}
    steps:
      - name: Check required jobs
        run: |
          test "$AFFECTED" = success
          if [ "$RUN_STATIC" = true ]; then
            test "$STATIC" = success
          fi
          if [ "$RUN_BUILD" = true ]; then
            test "$BUILD" = success
          fi
          if [ "$RUN_TESTS" = true ]; then
            test "$DATASETS" = success
            test "$TEST" = success
          fi
