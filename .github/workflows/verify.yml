name: verify
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "webapp/**"

permissions:
  contents: read

jobs:
  download-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/download-datasets

  static-analysis:
    uses: ./.github/workflows/_static-analysis.yml

  build:
    needs: [download-datasets, static-analysis]
    uses: ./.github/workflows/_build.yml

  test:
    needs: [build]
    uses: ./.github/workflows/_test.yml

  complete:
    if: always()
    needs: [download-datasets, static-analysis, build, test]
    runs-on: ubuntu-latest
    env:
      DATASETS: ${{ needs.download-datasets.result }}
      STATIC: ${{ needs.static-analysis.result }}
      BUILD: ${{ needs.build.result }}
      TEST: ${{ needs.test.result }}
    steps:
      - name: Check verification results
        run: |
          test "$DATASETS" = success
          test "$STATIC" = success
          test "$BUILD" = success
          test "$TEST" = success
