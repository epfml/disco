name: verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      # Main pushes bypass filtering and always run the entire pipeline.
      selection: ${{ github.event_name == 'push' && '["all"]' || steps.select.outputs.changes }}
      build: ${{ github.event_name == 'push' || steps.select.outputs.changes != '[]' }}
      docker: ${{ github.event_name == 'push' || steps.select.outputs.all == 'true' || steps.select.outputs.server == 'true' }}
      # The converter's build-only selection has no corresponding test suite.
      any_tests: ${{ github.event_name == 'push' || (steps.select.outputs.changes != '[]' && steps.select.outputs.changes != '["build"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checkouts use a synthetic merge commit; depth 2 includes its base parent.
          fetch-depth: 2
      - id: select
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ""
          filters: .github/ci-paths.yml
          predicate-quantifier: every

  download-datasets:
    needs: affected
    if: needs.affected.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/download-datasets

  static-analysis:
    needs: affected
    if: needs.affected.outputs.build == 'true'
    uses: ./.github/workflows/_static-analysis.yml

  build:
    needs: [affected, download-datasets, static-analysis]
    if: needs.affected.outputs.build == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      docker: ${{ needs.affected.outputs.docker == 'true' }}

  test:
    needs: [affected, build]
    if: needs.affected.outputs.any_tests == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      selection: ${{ needs.affected.outputs.selection }}

  complete:
    if: always()
    needs: [affected, download-datasets, static-analysis, build, test]
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ needs.affected.result }}
      RUN_BUILD: ${{ needs.affected.outputs.build }}
      RUN_TESTS: ${{ needs.affected.outputs.any_tests }}
      DATASETS: ${{ needs.download-datasets.result }}
      STATIC: ${{ needs.static-analysis.result }}
      BUILD: ${{ needs.build.result }}
      TEST: ${{ needs.test.result }}
    steps:
      - name: Check required jobs
        run: |
          test "$AFFECTED" = success
          if [ "$RUN_BUILD" = true ]; then
            test "$DATASETS" = success
            test "$STATIC" = success
            test "$BUILD" = success
          fi
          if [ "$RUN_TESTS" = true ]; then
            test "$TEST" = success
          fi
