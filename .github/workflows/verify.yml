name: verify
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # All inputs default to true: every update to main gets full verification.
  verify:
    uses: ./.github/workflows/_verify.yml

  complete:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERIFY: ${{ needs.verify.result }}
    steps:
      - name: Check verification results
        run: test "$VERIFY" = success
