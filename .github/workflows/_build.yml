name: build
on:
  workflow_call:

jobs:
  build-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=discojs run build
      - uses: actions/upload-artifact@v7
        with: { name: discojs-dist, path: discojs/dist }

  build-lib-node:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=discojs-node run build
      - uses: actions/upload-artifact@v7
        with: { name: discojs-node-dist, path: discojs-node/dist }

  build-lib-web:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=discojs-web build
      - uses: actions/upload-artifact@v7
        with: { name: discojs-web-dist, path: discojs-web/dist }

  build-server:
    needs: build-lib-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=server build
      - uses: actions/upload-artifact@v7
        with: { name: server-dist, path: server/dist }

  build-server-docker:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: docker build .
      - run: |
          docker build --quiet --load . | \
            xargs docker run --detach --publish 8080:8080
          timeout=120
          while ! curl http://localhost:8080
          do
            [ $timeout -eq 0 ] && exit 1
            sleep 1
            timeout=$((timeout - 1))
          done

  build-cli:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run --workspace=cli build

  build-webapp:
    needs: build-lib-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=webapp run build
      - uses: actions/upload-artifact@v7
        with: { name: webapp-dist, path: webapp/dist }

  build-docs-examples:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm --workspace=server run build
      - run: npm run build
        working-directory: docs/examples
