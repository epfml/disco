name: check-formatting
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm run format:check
