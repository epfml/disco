name: publish-deploy
on:
  push:
    branches: [develop]
    tags: [v*]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
          scope: "@epfml"
      - uses: pnpm/action-setup@v6
      - run: pnpm ci
      - run: pnpm -F 'discojs*' version prerelease --preid=p`date +%Y%m%d%H%M%S`
        if: github.ref_type == 'branch'
      - run: pnpm -F 'discojs*' run build
      - run: pnpm -F 'discojs*' publish --access public --tag latest

  build-webapp:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm -F webapp run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

  deploy-pages:
    needs: build-webapp
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish-github-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/epfml/disco
          tags: |
            type=semver,pattern={{version}}
            type=edge
      - uses: docker/build-push-action@v7
        id: build
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-server:
    needs: [publish-github-container]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: disco-367212
          workload_identity_provider: projects/905419434797/locations/global/workloadIdentityPools/github/providers/disco
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: disco
          region: europe-west6
          image: europe-west6-docker.pkg.dev/disco-367212/github/epfml/disco@${{ needs.publish-github-container.outputs.digest }}
