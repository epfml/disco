name: verify-pr
on:
  pull_request:

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.changes != '[]' }}
      docker: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.server == 'true' }}
      # The converter's build-only selection has no corresponding test suite.
      any_tests: ${{ steps.select.outputs.changes != '[]' && steps.select.outputs.changes != '["build"]' }}
      discojs: ${{ steps.select.outputs.all == 'true' }}
      discojs_node: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.discojs_node == 'true' }}
      discojs_web: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.discojs_web == 'true' }}
      server: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.server == 'true' }}
      webapp: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.webapp == 'true' }}
      cli: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.cli == 'true' }}
      docs_examples: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.docs_examples == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checkouts use a synthetic merge commit; depth 2 includes its base parent.
          fetch-depth: 2
      - id: select
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ""
          filters: .github/ci-paths.yml
          predicate-quantifier: every

  verify:
    needs: affected
    uses: ./.github/workflows/_verify.yml
    with:
      build: ${{ needs.affected.outputs.build == 'true' }}
      docker: ${{ needs.affected.outputs.docker == 'true' }}
      any_tests: ${{ needs.affected.outputs.any_tests == 'true' }}
      discojs: ${{ needs.affected.outputs.discojs == 'true' }}
      discojs_node: ${{ needs.affected.outputs.discojs_node == 'true' }}
      discojs_web: ${{ needs.affected.outputs.discojs_web == 'true' }}
      server: ${{ needs.affected.outputs.server == 'true' }}
      webapp: ${{ needs.affected.outputs.webapp == 'true' }}
      cli: ${{ needs.affected.outputs.cli == 'true' }}
      docs_examples: ${{ needs.affected.outputs.docs_examples == 'true' }}

  # Keep the required check even if selection fails before verification starts.
  complete:
    if: always()
    needs: [affected, verify]
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ needs.affected.result }}
      VERIFY: ${{ needs.verify.result }}
    steps:
      - name: Check verification results
        run: |
          test "$AFFECTED" = success
          test "$VERIFY" = success
