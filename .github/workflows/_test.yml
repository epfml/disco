name: test
on:
  workflow_call:

jobs:
  test-discojs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm exec vitest --run --project=discojs

  test-discojs-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm exec vitest --run --project=discojs-node

  test-discojs-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm exec vitest --run --project=discojs-web

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm exec vitest --run --project=server

  test-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm -F webapp run test:unit

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - uses: cypress-io/github-action@v7
        with:
          working-directory: webapp
          install: false
          start: pnpm exec vite --mode test --port 1351
          config: '{"excludeSpecPattern":["cypress/e2e/training/local/**/*.cy.ts","cypress/e2e/training/federated/**/*.cy.ts","cypress/e2e/training/decentralized/**/*.cy.ts"]}'

  test-local-training:
    name: local training (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [titanic, lus_covid]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - uses: cypress-io/github-action@v7
        with:
          working-directory: webapp
          install: false
          start: pnpm exec vite --mode test --port 1351
          spec: cypress/e2e/training/local/${{ matrix.task }}.cy.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: local-training-${{ matrix.task }}-screenshots
          path: webapp/cypress/screenshots
          if-no-files-found: ignore

  test-e2e-federated:
    name: federated webapp (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        task: [titanic, lus_covid]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - uses: cypress-io/github-action@v7
        env:
          VITE_SERVER_URL: http://localhost:8080
          DISCO_COLLABORATIVE_E2E: "1"
          DISCO_E2E_FEDERATED_TASK: ${{ matrix.task }}
        with:
          working-directory: webapp
          install: false
          start: >-
            node --experimental-strip-types cypress/support/federated_peer.ts,
            pnpm exec vite --mode test --port 1351 --strictPort
          wait-on: "http://localhost:8080, http://localhost:1351"
          spec: cypress/e2e/training/federated/${{ matrix.task }}.cy.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: federated-${{ matrix.task }}-screenshots
          path: webapp/cypress/screenshots
          if-no-files-found: ignore

  test-e2e-decentralized:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - uses: cypress-io/github-action@v7
        env:
          DEBUG: server:controllers:decentralized,discojs:client:decentralized
          DISCO_COLLABORATIVE_E2E: "1"
          VITE_SERVER_URL: http://localhost:8081
        with:
          working-directory: webapp
          install: false
          browser: chrome
          start: >-
            pnpm run test:e2e:decentralized:server,
            pnpm exec vite --mode test --port 1354 --strictPort
          wait-on: "http://localhost:8081, http://localhost:1354"
          config: baseUrl=http://localhost:1354
          spec: cypress/e2e/training/decentralized/node_peers.cy.ts

  test-e2e-browser-collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      # All three Cypress processes share one virtual display. Without it they
      # race to start their own Xvfb server on display :99.
      - run: xvfb-run --auto-servernum pnpm -F webapp run test:e2e:browser-collaboration

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - name: Verify CLI fails when required arguments are missing
        run: |
          if pnpm -F cli start -t cifar10 -u 3 -e 1 -r 1; then
            echo "Expected CLI to fail when required argument testID is missing, but it succeeded"
            exit 1
          fi
      - name: Run CLI decentralized training
        run: |
          node server/dist/main.js &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          timeout=120
          while ! curl -s --fail http://localhost:8080/ > /dev/null; do
            [ $timeout -eq 0 ] && echo "Server timeout" && exit 1
            sleep 1
            timeout=$((timeout - 1))
          done
          pnpm -F cli start -t cifar10 -u 3 -e 1 -r 1 -i ci-cifar10

  test-docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pull-dataset-artifacts
      - uses: actions/download-artifact@v8
        with: { name: all-builds }
      - run: pnpm run test
        working-directory: docs/examples
