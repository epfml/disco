name: test
on:
  workflow_call:
    inputs:
      discojs:
        type: boolean
        default: true
      discojs_node:
        type: boolean
        default: true
      discojs_web:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      webapp:
        type: boolean
        default: true
      cli:
        type: boolean
        default: true
      docs_examples:
        type: boolean
        default: true

# Dispatch selected suites after shared dataset preparation and builds.
jobs:
  test-discojs:
    if: inputs.discojs
    uses: ./.github/workflows/_test-discojs.yml

  test-discojs-node:
    if: inputs.discojs_node
    uses: ./.github/workflows/_test-discojs-node.yml

  test-discojs-web:
    if: inputs.discojs_web
    uses: ./.github/workflows/_test-discojs-web.yml

  test-server:
    if: inputs.server
    uses: ./.github/workflows/_test-server.yml

  test-webapp:
    if: inputs.webapp
    uses: ./.github/workflows/_test-webapp.yml

  test-cli:
    if: inputs.cli
    uses: ./.github/workflows/_test-cli.yml

  test-docs-examples:
    if: inputs.docs_examples
    uses: ./.github/workflows/_test-docs-examples.yml
