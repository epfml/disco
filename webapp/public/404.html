<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISCO</title>
    <script>
      // GitHub Pages SPA redirect workaround
      // Save the current path before reloading, with the fragment that
      // carries the token of a private task's link
      sessionStorage.redirect =
        location.pathname + location.search + location.hash;
      location.href = "/";
    </script>
  </head>
  <body></body>
</html>
